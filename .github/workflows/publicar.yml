# Publicar una versión: al subir una etiqueta vX.Y.Z (p. ej. v1.0.0 o v1.0.0-rc.2) se pasan las pruebas,
# se genera el instalador de Windows y se sube a un BORRADOR de GitHub Release (con latest.yml para las
# actualizaciones automáticas). Después se revisa el borrador en GitHub y se publica a mano.
name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    name: Instalador de Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas
        run: node tools/test-todo.cjs
      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión v$v de package.json"; exit 1; fi
      - name: Generar y subir el instalador (borrador)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 14
