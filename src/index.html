<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexura DJ Studio</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; img-src 'self' data: blob: https://*.ytimg.com https://*.ggpht.com https://*.googleusercontent.com https://*.scdn.co https://*.spotifycdn.com; connect-src 'self' http://127.0.0.1:11434 http://localhost:11434 https://www.googleapis.com https://www.youtube.com; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:;">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="logo"><span class="logo-mark"></span><b>NEXURA</b>&nbsp;DJ STUDIO</div>
      <div id="top-right">
        <div id="wave-layout-toggle" class="wave-layout-toggle" role="group" aria-label="Diseño de formas de onda">
          <span>ONDA</span>
          <button type="button" data-wave-layout="deck" aria-pressed="false" title="Forma de onda dentro de cada deck">EN DECK</button>
          <button type="button" data-wave-layout="serato" aria-pressed="true" title="Formas de onda grandes en la parte superior">SUPERIOR</button>
        </div>
      </div>
    </header>
    <section id="waves" aria-label="Formas de onda alineadas">
      <canvas id="wave0" class="wave"></canvas>
      <canvas id="wave1" class="wave"></canvas>
      <div id="wave-zoom"></div>
    </section>
    <section id="dj-layout" aria-label="Cabina de mezcla">
      <div id="deck0"></div>
      <div id="mixer"></div>
      <div id="deck1"></div>
    </section>
    <section id="fxbar" aria-label="Efectos">
      <div id="fx1"></div>
      <div id="fx2"></div>
    </section>
    <section id="sampler" hidden></section>
    <section id="library"></section>
    <footer id="statusbar"><span id="lib-status"></span><span class="brand">NexuraIA</span></footer>
  </div>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
